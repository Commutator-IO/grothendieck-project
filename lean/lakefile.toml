name = "grothendieck"
defaultTargets = ["Grothendieck", "Bourbaki", "Quillen", "Buffalo"]

# A `sorry` is a warning, and a proof with a warning in it proves nothing: the
# build fails on either.
[leanOptions]
warningAsError = true

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "715a03a90adf491de40fbec8b456c179a623435f"

[[lean_lib]]
name = "Grothendieck"

[[lean_lib]]
name = "Bourbaki"

[[lean_lib]]
name = "Quillen"

# The Buffalo lectures (1973): the entries of docs/buffalo-*/index.tex, one file per part.
[[lean_lib]]
name = "Buffalo"
globs = ["Buffalo.+"]
