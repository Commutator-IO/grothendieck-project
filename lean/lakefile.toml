name = "grothendieck"
defaultTargets = ["Grothendieck"]

# A `sorry` is a warning, and a proof with a warning in it proves nothing: the
# build fails on either.
[leanOptions]
warningAsError = true

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.0"

[[lean_lib]]
name = "Grothendieck"
