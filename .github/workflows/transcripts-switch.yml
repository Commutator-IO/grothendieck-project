name: Transcriptions switch

# Sets the repository variable RENDER_TRANSCRIPTS, then publishes the site with
# it (#31). Run by hand with the box ticked or not; every day at 16:00 Paris
# time it switches the transcriptions off and publishes.
#
# GITHUB_TOKEN cannot write repository variables, so the variable is set with
# RENDER_SWITCH_TOKEN, a fine-grained personal access token restricted to this
# repository with « Variables: Read and write ». Starting and cancelling the
# deploy uses GITHUB_TOKEN: a workflow_dispatch is one of the events it may
# trigger.

on:
  workflow_dispatch:
    inputs:
      render_transcripts:
        description: Show the transcriptions on the site (sets RENDER_TRANSCRIPTS, then publishes)
        type: boolean
        default: false
  # Cron is UTC and Paris changes its offset twice a year: both UTC hours are
  # scheduled, and a run acts only if it starts between 16:00 and 17:59 in Paris.
  # Four slots an hour, off the hour: GitHub delays scheduled runs and drops
  # some when it is busy — on 29 and 30 September not one of the :00, :07 or
  # :37 runs fired. Any slot that finds RENDER_TRANSCRIPTS still true switches
  # it off and publishes; the others do nothing, so the extra slots cost only
  # a few seconds each.
  schedule:
    - cron: '7,22,37,52 14 * * *' # 16:07–16:52 in Paris in summer time (CEST, UTC+2)
    - cron: '7,22,37,52 15 * * *' # 16:07–16:52 in Paris in winter time (CET, UTC+1)

permissions:
  actions: write
  contents: read

concurrency:
  group: transcripts-switch
  cancel-in-progress: false

jobs:
  switch:
    name: Set RENDER_TRANSCRIPTS and publish
    runs-on: ubuntu-latest
    env:
      REPO: ${{ github.repository }}
    steps:
      # A scheduled run acts on the Paris clock when it starts. GitHub starts
      # them late, sometimes by most of an hour, so 17:xx still counts; a slot
      # of the other UTC hour (15:xx Paris in winter, 17:xx in summer for the
      # 15 UTC line) is before 16:00 or finds the variable already false.
      - name: Decide
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT: ${{ inputs.render_transcripts }}
          CURRENT: ${{ vars.RENDER_TRANSCRIPTS }}
        run: |
          if [ "$EVENT" = schedule ]; then
            hour=$(TZ=Europe/Paris date +%H)
            if [ "$hour" != 16 ] && [ "$hour" != 17 ]; then
              echo "Not 16:00–17:59 in Paris ($(TZ=Europe/Paris date +%H:%M), « $SCHEDULE »): nothing to do."; value=
            elif [ "$CURRENT" = false ]; then
              echo "RENDER_TRANSCRIPTS is already false: nothing to do."; value=
            else
              value=false
            fi
          else
            value=$INPUT
          fi
          echo "value=$value" >> "$GITHUB_OUTPUT"
          [ -n "$value" ] && echo "::notice::RENDER_TRANSCRIPTS=$value ($EVENT)" || true

      - name: Set the repository variable
        if: steps.decide.outputs.value != ''
        env:
          GH_TOKEN: ${{ secrets.RENDER_SWITCH_TOKEN }}
          VALUE: ${{ steps.decide.outputs.value }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Secret RENDER_SWITCH_TOKEN missing: a fine-grained token on this repository with « Variables: Read and write »."
            exit 1
          fi
          gh variable set RENDER_TRANSCRIPTS --repo "$REPO" --body "$VALUE"
          gh variable list --repo "$REPO" | grep RENDER_TRANSCRIPTS

      # A deploy already queued or running took the old value when it was
      # triggered, and would publish it; it is cancelled before a new one starts.
      - name: Cancel deploys started with the old value
        if: steps.decide.outputs.value != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for id in $(gh run list --repo "$REPO" --workflow deploy.yml --limit 20 \
                --json databaseId,status -q '.[] | select(.status != "completed") | .databaseId'); do
            gh run cancel "$id" --repo "$REPO" && echo "cancelled $id"
          done

      - name: Publish
        if: steps.decide.outputs.value != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VALUE: ${{ steps.decide.outputs.value }}
        run: gh workflow run deploy.yml --repo "$REPO" --ref main -f render_transcripts="$VALUE"
