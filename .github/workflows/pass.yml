# A pass, run in the cloud, billed to the API rather than to anyone's
# subscription.
#
# `workflow_dispatch` only. Nothing here fires on a push, a schedule or a pull
# request, because every run of it spends real money — a transcription batch is
# roughly $51 on Opus 5 and $103 on Fable 5 at list price (`npm run usage` for
# where those come from). It is started by hand, with a budget, or not at all.
#
# What it produces is a branch and a pull request, never a commit on `main`.
#
# The agent never commits anything. `scripts/headless.mjs` installs a
# PreToolUse hook that refuses `git commit` and `git push` from the agent's own
# Bash tool, so all a pass does is write files into the runner's working tree —
# ordinary Write and Edit calls, nothing special. The staging, the commit and
# the push all happen in the step below, after `query()` has returned: a
# different process, not subject to the hook, running with the job's
# `contents: write` permission. The split is the point. The agent produces a
# draft; deciding that a draft belongs in the history is somebody else's act.
#
# One consequence worth knowing: a push made with `GITHUB_TOKEN` deliberately
# does not trigger further workflow runs, so the draft pull request opened here
# arrives *without* the deploy workflow's checks having run on it. Push a commit
# to the branch yourself, or close and reopen the PR, and they run. Wiring a
# personal access token in would make them run unattended, and would also mean
# an unattended pass could trigger a deploy — which is a trade to make
# deliberately, not by default.
#
# Requires one repository secret, `ANTHROPIC_API_KEY`. The point of the key
# rather than a `claude setup-token` is independence: the run belongs to an API
# account with its own spend limit, not to whoever happens to be logged in.
# Set a workspace spend limit in the Anthropic Console as the real backstop —
# the `budget` input below stops one pass, not a month of them.

name: Run a pass

on:
  workflow_dispatch:
    inputs:
      step:
        description: Which edition to produce
        required: true
        default: transcribe
        type: choice
        options: [transcribe, modernize, tag, findings]
      folder:
        description: Folder, e.g. 115
        required: true
        type: string
      batch:
        description: Batch number — transcription only, one batch per pass
        required: false
        type: string
      model:
        description: The two the skills permit, and nothing else
        required: true
        default: claude-opus-5
        type: choice
        options: [claude-opus-5, claude-fable-5]
      budget:
        description: Stop the pass above this many dollars
        required: true
        default: "80"
        type: string

# Enough to push a branch and open a pull request. Nothing deploys from here.
permissions:
  contents: write
  pull-requests: write

jobs:
  pass:
    name: ${{ inputs.step }} ${{ inputs.folder }} ${{ inputs.batch }}
    runs-on: ubuntu-latest
    # A GitHub-hosted job is capped at six hours. An interactive transcription
    # ran one to five, so this is close to the ceiling rather than comfortably
    # under it — which is itself worth measuring on the first run.
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Fail early if there is no key
        run: |
          test -n "${{ secrets.ANTHROPIC_API_KEY }}" || {
            echo "ANTHROPIC_API_KEY is not set for this repository."
            echo "Settings → Secrets and variables → Actions → New repository secret."
            exit 1
          }

      - run: npm ci

      # The Agent SDK is not a dependency of the package — see the comment in
      # scripts/headless.mjs — so a pass asks for it by name. npm resolves the
      # linux-x64 Claude Code binary automatically from the per-platform
      # packages, so there is nothing to choose here.
      - name: Install the Agent SDK
        run: npm install --no-save @anthropic-ai/claude-agent-sdk

      # `npm run tiles` and `npm run archive` shell out to pdftoppm and
      # pdfinfo. Installed explicitly rather than assumed present on the image.
      - name: Install poppler
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      # For the overfull-box gate, which reads the engine's log.
      - name: Install tectonic
        run: |
          curl -fsSL https://drop-sh.fullyjustified.net | sh
          sudo mv tectonic /usr/local/bin/

      - uses: actions/cache@v4
        with:
          path: ~/.cache/Tectonic
          key: tectonic-${{ runner.os }}-v1

      # The mirror is gitignored, so every run fetches the folder it needs from
      # Montpellier. Folders run from 4 MB to 270 MB; the heaviest need the
      # enlarged heap the npm script already asks for.
      # Every input reaches the shell through the environment, never through
      # `${{ }}` interpolated into a `run:` script. `folder` is free text, and
      # interpolated it would be a command-injection hole in a public
      # repository — one that only a dispatcher with write access could reach,
      # which is a reason it has never been exploited and not a reason to
      # leave it.
      - name: Mirror the folder
        env:
          FOLDER: ${{ inputs.folder }}
        run: npm run archive -- "$FOLDER"

      - name: Run the pass
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          STEP: ${{ inputs.step }}
          FOLDER: ${{ inputs.folder }}
          BATCH: ${{ inputs.batch }}
          MODEL: ${{ inputs.model }}
          BUDGET: ${{ inputs.budget }}
        run: |
          npm run headless -- smoke
          npm run headless -- "$STEP" "$FOLDER" ${BATCH:+"$BATCH"} \
            --model "$MODEL" --budget "$BUDGET"

      # Uploaded whether or not the gates passed. A pass that ended badly is
      # still evidence about what a headless pass does, and the meter is the
      # number this whole exercise exists to find out.
      - name: Keep the meter
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: usage-${{ inputs.step }}-${{ inputs.folder }}-${{ inputs.batch || 'folder' }}
          path: archives/usage/

      - name: Open a pull request with what it wrote
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STEP: ${{ inputs.step }}
          FOLDER: ${{ inputs.folder }}
          BATCH: ${{ inputs.batch }}
          MODEL: ${{ inputs.model }}
          RUN_ID: ${{ github.run_id }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          LABEL="$STEP $FOLDER${BATCH:+ $BATCH}"
          BRANCH="pass/$STEP-$FOLDER${BATCH:+-$BATCH}-$RUN_ID"
          git switch -c "$BRANCH"

          # Only the editions, named explicitly rather than `git add -A`.
          #
          # The derived material is gitignored already — public/transcripts/,
          # every PDF, the archives/ mirror — so `-A` would mostly work, and
          # "mostly" is the wrong standard for deciding what enters the
          # history unattended. These four paths are what a pass legitimately
          # writes: the editions themselves, the three states no file can
          # prove, the findings the novelty skill appends, and the lexicon,
          # which `npm run lexicon` regenerates from every transcription and
          # which is versioned — it was missing from this list, and a pass that
          # regenerated it would have had that thrown away without a word.
          git add -- \
            transcripts/ \
            src/content/findings.ts \
            .claude/skills/transcribe-grothendieck/references/lexicon.md \
            .claude/skills/transcribe-grothendieck/references/lexicon.json \
            2>/dev/null || true

          # Anything else the pass touched is reported rather than dropped in
          # silence. A file changed and not carried is a thing somebody needs
          # to know about, whichever way it should have gone.
          LEFT="$(git status --porcelain --untracked-files=normal | grep -v '^[AMD] ' || true)"
          if [ -n "$LEFT" ]; then
            echo "::warning::the pass also changed files that were not carried into the pull request"
            echo "$LEFT"
          fi

          git diff --cached --quiet && { echo "The pass wrote nothing — no pull request."; exit 0; }

          git commit -m "$LABEL: a headless pass, unchecked against the pages" \
                     -m "Produced by .github/workflows/pass.yml on $MODEL. Nobody has read this beside the facsimile."
          git push -u origin "$BRANCH"

          gh pr create --draft --base main --head "$BRANCH" \
            --title "$LABEL — headless, unchecked" \
            --body "$(cat <<'BODY'
          A pass run by [`pass.yml`](../blob/main/.github/workflows/pass.yml), with nobody in front of it.

          **Draft, and it should stay a draft until someone has read it beside the facsimile.** The gates in `npm run verify` prove the file is well-formed — it renders, every formula typesets, no line runs past the right margin. They prove nothing at all about whether a word matches the page, and a fluent wrong word is the failure this edition has no mechanical defence against.

          The token meter for the run is attached to the workflow run as an artifact.
          BODY
          )"
