name: sbom

# The site's dependency inventory (SBOM), and a weekly re-scan of it.
#
# A scan at build time only knows the advisories published before the build.
# The ones that concern a live site come out later, so the inventory is kept
# and checked again against current vulnerability data every Monday.
#
# The site deploys from main on every push (deploy.yml), so production is main:
# one inventory, generated from the commit being checked, covers both. It is
# taken from package-lock.json alone, so the Lean dependencies under lean/.lake
# and anything else in the tree stay out of it.
#
# The site is served as static files, so most of these packages only run during
# the build. When a finding cannot be reached in what is served, record it in
# .github/vex.openvex.json with its justification. Do not hide it with a scan
# setting: the VEX file keeps the decision, its reason and its date in one place.

on:
  push:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
      - .github/vex.openvex.json
      - .github/workflows/sbom.yml
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - .github/vex.openvex.json
      - .github/workflows/sbom.yml
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Syft leaves devDependencies out by default. Here nearly everything is
      # one, KaTeX included, which postinstall copies into the served site, so
      # they are kept in the inventory.
      - name: Inventory the dependencies (SBOM)
        uses: anchore/sbom-action@v0
        env:
          SYFT_JAVASCRIPT_INCLUDE_DEV_DEPENDENCIES: 'true'
        with:
          file: package-lock.json
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: false

      - name: Keep the SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: sbom.cdx.json
          retention-days: 90

      - name: Scan against current vulnerability data
        uses: anchore/scan-action@v7
        with:
          sbom: sbom.cdx.json
          vex: .github/vex.openvex.json
          severity-cutoff: high
          fail-build: true
          output-format: table
