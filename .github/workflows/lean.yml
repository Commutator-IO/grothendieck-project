name: lean

# The Lean proofs in lean/: statements of the Bourbaki rédactions and of
# Quillen's notebooks, proved against mathlib (the proofs of the Grothendieck
# fonds live in Commutator-IO/GrothendieckArchivesProofs). Runs when lean/
# changes, and by hand. It does not gate the deploy — a proof checks a
# reading, not the site.
on:
  push:
    branches: [main]
    paths: ['lean/**', '.github/workflows/lean.yml']
  pull_request:
    paths: ['lean/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean:
    name: lake build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Installs the toolchain lean/lean-toolchain names, fetches mathlib's
      # prebuilt cache, and runs `lake build` (every warning an error, so a
      # `sorry` fails it). Then axiom-audit fails if any declaration of the
      # library depends on an axiom beyond propext, Classical.choice and
      # Quot.sound; sorry and native_decide count as such axioms.
      # leanchecker, the independent re-check, is left out: it got the
      # runner stopped (runs 39902170011, 39917152591).
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          axiom-audit: true

  # The generated theorems of the draft docs/bridges, in the Lake package lean/bridges: they are
  # stated and proved on top of lean-pool's ToposTheoreticBridges, pinned in its lakefile.
  bridges:
    name: lake build (bridges)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean/bridges
          axiom-audit: true
