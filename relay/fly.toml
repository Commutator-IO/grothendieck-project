# fly.io. Any host that runs a container works the same way — Render, Railway,
# a VPS — and none of them needs a DNS change: the platform hostname
# (relay-name.fly.dev) already has a valid certificate, which is the only
# property the browser cares about.
app = "grothendieck-relay"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  ALLOWED_ORIGINS = "https://grothendieck.commutator.io"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  # Scale to zero. The relay is idle unless someone is reading a facsimile,
  # and a suspended machine resumes in well under a second.
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "5s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"
