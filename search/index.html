<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Safety net for static hosting: after a redeploy, a cached page may
      // reference an asset whose hashed name has changed, which shows up as a
      // blank page. We detect the load failure and reload once — a reload
      // revalidates the HTML and picks up the right names.
      (function () {
        try {
          addEventListener(
            'error',
            function (e) {
              var el = e.target;
              var u = el && (el.src || el.href);
              if (u && /\/assets\//.test(u) && !sessionStorage.getItem('assetReload')) {
                sessionStorage.setItem('assetReload', '1');
                location.reload();
              }
            },
            true,
          );
          addEventListener('load', function () {
            sessionStorage.removeItem('assetReload');
          });
        } catch (_) {}
      })();
    </script>
    <title>Search — Grothendieck Archives</title>
    <meta name="description" content="Search the metadata of every document the site catalogues — Montpellier folders, letters, the Bourbaki archive, Quillen's notebooks, the IHÉS fonds, the BnF boxes and the Buffalo lectures — with links to read each one at its holder." />
    <meta property="og:title" content="Search — Grothendieck Archives" />
    <meta property="og:description" content="Search the metadata of every document the site catalogues — Montpellier folders, letters, the Bourbaki archive, Quillen's notebooks, the IHÉS fonds, the BnF boxes and the Buffalo lectures — with links to read each one at its holder." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://grothendieck.commutator.io/search/" />
    <link rel="canonical" href="https://grothendieck.commutator.io/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Caveat:wght@500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // The search became the front page on 2 November 2026; its links keep their fragment.
      location.replace('/' + location.search + location.hash);
    </script>
  </body>
</html>
